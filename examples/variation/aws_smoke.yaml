# Smoke VariationSpec — quick local run: 2 families x 1 scale x 5 seeds = 10 scenarios.
# See docs/superpowers/specs/2026-07-06-FXL-VAR-1-variation-validation-design.md §8.
families:
  - ci_cd_iam_chain
  - public_data_exposure
seed_start: 0
seed_count: 5
scale_profiles:
  - tiny
variation_axes:
  decoy: ["0", "1", "2"]
  fp: ["0", "1"]
  ctrl: ["0", "1"]
constraints:
  no_apply: true
  no_credentials: true
  max_failures_before_abort: 25
validation_profile:
  run_validate: true
  run_report: true
  run_terraform_validate: if_available
  run_checkov: if_available
  run_opa: if_available
