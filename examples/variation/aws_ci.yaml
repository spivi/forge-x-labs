# CI VariationSpec: 2 families x 2 scales x 25 seeds = 100 scenarios.
families:
  - ci_cd_iam_chain
  - public_data_exposure
seed_start: 0
seed_count: 25
scale_profiles:
  - tiny
  - small
variation_axes:
  decoy: ["0", "1", "2"]
  fp: ["0", "1"]
  ctrl: ["0", "1"]
  path_length: ["3", "4", "5", "6"]
constraints:
  no_apply: true
  no_credentials: true
  max_failures_before_abort: 25
validation_profile:
  run_validate: true
  run_report: true
  run_terraform_validate: if_available
  run_checkov: if_available
  run_opa: if_available
