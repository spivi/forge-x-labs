# External dummy account trusted into a role that can read sensitive data.
cloud: aws
scenario_type: cross_account_trust
environment: prod
difficulty: medium
company_profile:
  type: b2b_saas
  size: medium
  app_name: partner-exchange
requirements:
  critical_chains: 1
  medium_findings: 1
  false_positives: 1
constraints:
  no_real_secrets: true
  no_destructive_permissions: true
  max_resources: 40
  deployable: false
