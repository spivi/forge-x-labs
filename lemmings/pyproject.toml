[project]
name = "lemmings"
version = "0.1.0"
description = "Stochastic discrete-event simulator for the agentic development pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alex Spivakovsky", email = "alex.spivakovsky@gmail.com" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mc = [
    "scipy>=1.13",
    "joblib>=1.4",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "scipy>=1.13",
    "joblib>=1.4",
]

[project.scripts]
lemmings = "lemmings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemmings"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
# TC001/TC003 (type-only-imports) noisy with Pydantic + dataclasses; leave runtime.
ignore = ["UP042"]  # str-enum inheritance is intentional for JSON serialisation

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/lemmings --cov-report=term-missing --cov-fail-under=80"
