name: CI

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.4 mypy
      - run: pip install poetry-core && pip install -e .
      - run: cloudforge version
      - run: ruff check app/ tests/cloudforge/ tests/security/ tests/unit/ tests/integration/ tests/property/
      - run: ruff format --check app/ tests/cloudforge/ tests/security/ tests/unit/ tests/integration/ tests/property/
      - run: mypy app/ --ignore-missing-imports

  test-fast:
    needs: [lint-and-type-check]
    runs-on: ubuntu-latest
    name: "Test: Fast"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio pytest-cov httpx pytest-mock hypothesis
      - run: pip install poetry-core && pip install -e .
      - run: python -m pytest tests/ --cov=app --cov-report=xml -q --hypothesis-profile=ci

  test-tools:
    needs: [lint-and-type-check]
    runs-on: ubuntu-latest
    name: "Test: Optional tools"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe optional tools
        id: tools
        run: |
          echo "has_terraform=false" >> "$GITHUB_OUTPUT"
          echo "has_checkov=false" >> "$GITHUB_OUTPUT"
          echo "has_opa=false" >> "$GITHUB_OUTPUT"
          if command -v terraform >/dev/null; then
            echo "has_terraform=true" >> "$GITHUB_OUTPUT"
          fi
          if command -v checkov >/dev/null; then
            echo "has_checkov=true" >> "$GITHUB_OUTPUT"
          fi
          if command -v opa >/dev/null; then
            echo "has_opa=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tools.outputs.has_opa == 'true'
        run: opa test policies/ -v || true
