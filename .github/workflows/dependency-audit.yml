name: Weekly Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and audit tools
        run: |
          pip install -e .
          pip install pip-audit
      - name: Run pip-audit
        id: audit
        continue-on-error: true
        run: |
          pip-audit --format=json --output=audit-results.json 2>&1 || true
          pip-audit --format=columns --output=audit-columns.txt 2>&1 || true

          VULN_COUNT=$(python3 -c "
          import json
          try:
              with open('audit-results.json') as f:
                  data = json.load(f)
              vulns = [d for d in data if d.get('vulns')]
              total = sum(len(d['vulns']) for d in vulns)
              print(total)
          except Exception:
              print(0)
          ")
          echo "vuln_count=$VULN_COUNT" >> "$GITHUB_OUTPUT"

          SUMMARY=$(python3 -c "
          import json
          try:
              with open('audit-results.json') as f:
                  data = json.load(f)
              lines = []
              for dep in data:
                  if dep.get('vulns'):
                      for v in dep['vulns']:
                          fix = v.get('fix_versions', ['no fix available'])
                          fix_str = ', '.join(fix) if isinstance(fix, list) else str(fix)
                          lines.append(
                              f\"| {dep['name']} | {dep['version']} | {v['id']} | {v.get('description', 'N/A')[:80]} | {fix_str} |\"
                          )
              if lines:
                  print('| Package | Version | CVE | Description | Fix |')
                  print('|---------|---------|-----|-------------|-----|')
                  print('\n'.join(lines))
              else:
                  print('No vulnerabilities found.')
          except Exception as e:
              print(f'Audit parse error: {e}')
          ")
          echo "summary<<SUMMARY_EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "SUMMARY_EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Issue for vulnerabilities
        if: steps.audit.outputs.vuln_count != '0'
        run: |
          BODY=$(cat <<ISSUE_EOF
          ## Weekly dependency audit: vulnerabilities found

          **Scan date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Vulnerabilities**: ${{ steps.audit.outputs.vuln_count }}

          ### Findings

          ${{ steps.audit.outputs.summary }}

          ### Action

          - Review each CVE and assess impact
          - Update affected packages where fixes exist
          ISSUE_EOF
          )
          gh issue create \
            --title "Security: ${{ steps.audit.outputs.vuln_count }} dependency vulnerabilities ($(date -u +%Y-%m-%d))" \
            --body "$BODY" \
            --label "security:vulnerability"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary (no vulnerabilities)
        if: steps.audit.outputs.vuln_count == '0'
        run: echo "No dependency vulnerabilities found."
