name: Weekly Dependency Audit

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and audit tools
        run: |
          pip install -e .
          pip install pip-audit

      - name: Run pip-audit
        id: audit
        continue-on-error: true
        run: |
          pip-audit --format=json --output=audit-results.json 2>&1 || true
          pip-audit --format=columns --output=audit-columns.txt 2>&1 || true

          # Count vulnerabilities
          VULN_COUNT=$(python3 -c "
          import json, sys
          try:
              with open('audit-results.json') as f:
                  data = json.load(f)
              vulns = [d for d in data if d.get('vulns')]
              total = sum(len(d['vulns']) for d in vulns)
              print(total)
          except:
              print(0)
          ")
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT

          # Build summary for issue body
          SUMMARY=$(python3 -c "
          import json, sys
          try:
              with open('audit-results.json') as f:
                  data = json.load(f)
              lines = []
              for dep in data:
                  if dep.get('vulns'):
                      for v in dep['vulns']:
                          fix = v.get('fix_versions', ['no fix available'])
                          fix_str = ', '.join(fix) if isinstance(fix, list) else str(fix)
                          lines.append(f\"| {dep['name']} | {dep['version']} | {v['id']} | {v.get('description', 'N/A')[:80]} | {fix_str} |\")
              if lines:
                  header = '| Package | Version | CVE | Description | Fix |'
                  sep = '|---------|---------|-----|-------------|-----|'
                  print(header)
                  print(sep)
                  print('\n'.join(lines))
              else:
                  print('No vulnerabilities found.')
          except Exception as e:
              print(f'Audit parse error: {e}')
          ")
          echo "summary<<SUMMARY_EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "SUMMARY_EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue for vulnerabilities
        if: steps.audit.outputs.vuln_count != '0'
        run: |
          BODY=$(cat <<'ISSUE_EOF'
          ## Weekly Dependency Audit — Vulnerabilities Found

          **Scan date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Vulnerabilities**: ${{ steps.audit.outputs.vuln_count }}

          ### Findings

          ${{ steps.audit.outputs.summary }}

          ### Action Required

          - Review each CVE and assess impact on this project
          - Update affected packages where fixes are available
          - For packages with no fix: evaluate risk and consider alternatives

          ---
          *Generated by the Security Architect weekly dependency audit*
          ISSUE_EOF
          )

          gh issue create \
            --title "Security: ${{ steps.audit.outputs.vuln_count }} dependency vulnerabilities found ($(date -u +%Y-%m-%d))" \
            --body "$BODY" \
            --label "security:vulnerability"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to inbox (critical findings)
        if: steps.audit.outputs.vuln_count != '0'
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FILENAME=".dev-context/inbox/digest/dep-audit-$(date -u +%Y-%m-%d).md"
          cat > "$FILENAME" <<INBOX_EOF
          ---
          from: Security Architect
          type: digest
          status: PENDING
          created: $TIMESTAMP
          ---

          # Weekly Dependency Audit — ${{ steps.audit.outputs.vuln_count }} Vulnerabilities

          ${{ steps.audit.outputs.summary }}

          ## Your Response

          <!-- Change status above to ACKNOWLEDGED after review -->
          INBOX_EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILENAME"
          git commit -m "chore: weekly dependency audit digest ($(date -u +%Y-%m-%d))"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary (no vulnerabilities)
        if: steps.audit.outputs.vuln_count == '0'
        run: echo "No dependency vulnerabilities found. All clear."
