repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        exclude: ^(scripts/|tests/)
        additional_dependencies:
          - pydantic>=2.10
          - types-PyYAML
  - repo: local
    hooks:
      - id: no-master-commit
        name: Block direct commits to master
        entry: bash scripts/no-master-commit.sh
        language: system
        always_run: true
        stages: [pre-commit]
      - id: check-signoff
        name: Require Signed-off-by trailer
        entry: bash scripts/check-signoff.sh
        language: system
        stages: [commit-msg]
