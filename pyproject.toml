[tool.poetry]
name = "cloudforge"
version = "0.1.0"
description = "Local-first generation of validated cloud-risk scenarios for scanner benchmarking, training, and prioritization research."
authors = ["Alex Spivakovsky <alex.spivakovsky@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.scripts]
cloudforge = "app.cli:app"

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27"
pydantic = "^2.0"
python-dotenv = "^1.0"
typer = { extras = ["all"], version = "^0.15" }
rich = "^13.9"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8"
mypy = "^1.13"
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
pre-commit = "^4.0"
types-pyyaml = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 99
target-version = "py312"
# `flavors/` holds un-instantiated project templates whose pyproject.toml files still
# contain un-substituted placeholder tokens (invalid TOML keys). They are scaffolding,
# not source, so exclude them from linting/parsing.
extend-exclude = ["flavors/"]

[tool.ruff.lint]
# TCH/TC intentionally omitted: this codebase resolves type annotations at runtime
# (Pydantic v2 model_validate needs field-type imports importable at runtime), so
# moving them into `if TYPE_CHECKING:` blocks would break validation.
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
# terraform_blocks.py embeds HCL templates; a few HCL lines exceed the line length.
"app/cloudforge/pipeline/terraform_blocks.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-m "not stress"` keeps the slow mutation stress suite (FXL-N3) OUT of the default
# run — a bare `pytest` (local and CI, which invokes `pytest tests/ ...` with no `-m`)
# deselects everything marked `stress`. Opt in explicitly with `pytest -m stress`.
# The opt-in 1,000-seed variant is additionally gated behind CLOUDFORGE_STRESS_1K=1.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80 -m 'not stress'"
markers = [
  "stress: slow, many-seed mutation risk-preservation stress tests (FXL-N3); deselected by default, run with `pytest -m stress`",
  "slow: heavy/long-running tests; the pre-push backstop deselects these (`-m 'not slow'`)",
]
