[tool.poetry]
name = "cloudforge"
version = "1.0.0"
description = "Local-first generator of validated, never-applied AWS misconfig labs. No cloud account required."
authors = ["Alex Spivakovsky <alex.spivakovsky@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "app" }]
homepage = "https://github.com/spivi/forge-x-labs"
repository = "https://github.com/spivi/forge-x-labs"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.scripts]
cloudforge = "app.cli:app"

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27"
pydantic = "^2.0"
python-dotenv = "^1.0"
typer = { extras = ["all"], version = "^0.15" }
rich = "^13.9"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9"
mypy = "^1.13"
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
pre-commit = "^4.0"
types-pyyaml = "^6.0"
hypothesis = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 99
target-version = "py312"
# Local-only trees that stay on disk via .gitignore.
extend-exclude = ["flavors/", "lemmings/", ".claude/", ".dev-context/"]

[tool.ruff.lint]
# TCH/TC intentionally omitted: this codebase resolves type annotations at runtime
# (Pydantic v2 model_validate needs field-type imports importable at runtime), so
# moving them into `if TYPE_CHECKING:` blocks would break validation.
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
# terraform_blocks.py embeds HCL templates; a few HCL lines exceed the line length.
"app/cloudforge/pipeline/terraform_blocks.py" = ["E501"]
"app/cloudforge/io/__init__.py" = ["A005"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", "hooks", "harness", "scripts"]
# Default run skips slow mutation stress and real-network tests.
# Opt in with `pytest -m stress` or `pytest -m internet`.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80 -m 'not stress and not internet'"
markers = [
  "unit: unit tests (fast, no external dependencies)",
  "security: security-focused tests",
  "property: property-based tests via hypothesis",
  "integration: integration tests",
  "internet: opt-in real-network tests; run with `pytest -m internet`",
  "stress: slow mutation stress tests; run with `pytest -m stress`",
  "slow: heavy or long-running tests",
]
