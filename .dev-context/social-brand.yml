brand:
  name: "{{PROJECT_NAME}}"
  tagline: "Your project tagline"
  tagline_secondary: ""

  colors:
    primary: "#3B82F6"
    secondary: "#1E40AF"
    accent: "#0F172A"
    background: "#FFFFFF"
    text: "#1A1A1A"
    text_light: "#666666"
    surface: "#F7F7F7"
    success: "#22C55E"
    error: "#EF4444"

  fonts:
    heading: "Inter"
    body: "Inter"
    import_url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"

  logo:
    path: ""
    watermark_position: "bottom-right"
    watermark_opacity: 0.3
    watermark_size: 40

  frame:
    style: "minimal"
    border_radius: 24
    padding: 16
    border_color: "#E5E5E5"
    shadow: "0 20px 60px rgba(0,0,0,0.15)"

  animation:
    easing: "cubic-bezier(0.16, 1, 0.3, 1)"
    stagger_delay_ms: 120
    fade_duration_ms: 400
    slide_distance_px: 30
