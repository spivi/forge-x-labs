# STATUS.md drift-detection config (scripts/status_drift.py).
#
# mode: how the orchestrator reacts when `status_drift.py check` finds drift
#   (orphaned worktree rows, stale Queued tickets) — `check` always exits 1 on
#   drift so callers can detect it; this only sets the default reaction.
#   warn  => surface the drift, proceed (default; never blocks a sprint)
#   block => hard-stop until STATUS.md is reconciled (run `status_drift.py sanitize`)
#   off   => skip the check entirely
#
# Overridden by STATUS_DRIFT_MODE in project.conf, then by `check --mode`.
mode: warn
