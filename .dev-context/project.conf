# Project Configuration
# Set by setup.sh during project creation. Do not change after Linear project is created.

PROJECT_ID=FXL
PROJECT_NAME=cloudforge
LINEAR_TEAM=FXL

# Tracker backend for the planning/estimate seam: none | linear | github_projects
# `none` keeps everything in .dev-context/kpis/estimates.csv (canonical) and
# mirrors nowhere -- the full learning loop works without an external tracker.
TRACKER_BACKEND=none

# Learning-loop capture gates (see rules/labeling.md).
# Sub-agent actuals capture: on => /sprint appends a cost-ledger row per spawned
# Task agent via scripts/ledger_append.py (closes the parallel-cost gap). Pure-
# additive + fail-soft; safe to leave on.
SUBAGENT_LEDGER_CAPTURE=on

# STATUS.md drift detection (scripts/status_drift.py): warn | block | off.
# warn => surface orphaned worktrees / stale tickets but never block a sprint.
STATUS_DRIFT_MODE=warn

# CI wall-clock capture (scripts/ci_latency.py) on merge: on | off. Fail-soft no-op
# without gh / a PR / GITHUB_OWNER+GITHUB_REPO. Feeds kpis/ci-latency.csv for /debrief.
CI_LATENCY_CAPTURE=on
# GitHub owner/repo for gh-API calls (ci_latency, review_capture). Set by setup.sh.
GITHUB_OWNER=
GITHUB_REPO=

# Production health-check URL for the /monitor skill (health endpoint base URL, no
# trailing path). Empty => /monitor asks for it or infers from Railway/hosting MCP.
PRODUCTION_URL=

# Generic vis-UI screenshot gate (scripts/app_screenshot.py): on | off. When on, a
# ticket labeled `area:ui` gets its routes screenshotted before merge (advisory, never
# blocks). Requires Playwright (opt-in). Off by default.
VIS_UI_GATE=off

# Harness-efficiency filter (scripts/harness_router.sh): on | off. When on, long
# CI/diff output is condensed through the Gemini CLI before entering Claude's context,
# and clean non-security PR diffs can skip the Claude review pre-pass. Requires a
# `gemini` CLI install (opt-in). Fully fail-soft (exit 2 => caller uses raw input).
# Off by default. Feeds kpis/cli-routing.csv (`debrief.py --cli-routing-report`).
HARNESS_ROUTER=off
GEMINI_MODEL=gemini-2.5-flash

# Security-surface glob (ERE): diff paths that ALWAYS go to Claude, never Gemini, and
# force the stronger reviewer model in the AI review gate. Tune per project to cover
# its sensitive surfaces. Used by harness_router.sh + the review gate.
SECURITY_SURFACE_GLOB=auth|secret|crypto|token|password|\.dev-context/DECISIONS\.md|security\.md

# Iteration gate (rules/iteration-gate.md): on | off. When on, /develop + /sprint
# hard-stop on no-ticket / out-of-iteration / scope-break. Strength scales with
# TRACKER_BACKEND — advisory (judgment-based) under `none`, enforced under
# linear/github_projects. Safety property; fail-soft. On by default.
ITERATION_GATE=on

# Rail R/U evidence ledger (scripts/rails.py): on | off. When on, /sprint merge
# records each PR's `Rail evidence:` line into kpis/rails.csv and /debrief reports
# coverage. Fail-soft (a ledger error never blocks a merge). On by default.
RAILS_LEDGER=on

# Commit sign-off enforcement (scripts/check-signoff.sh, commit-msg hook): on | off.
# Requires the mandated Signed-off-by trailer (rules/git.md). SIGNOFF_EMAIL is the
# required signer (set by setup.sh from git config); empty => accept any well-formed
# trailer. Safety gate; on by default. Install: pre-commit install --hook-type commit-msg.
SIGNOFF_ENFORCE=on
SIGNOFF_EMAIL=

# Fast pre-push test backstop (scripts/pre_push_tests.sh, pre-push hook): on | off.
# Skips when no python changed; impacted-only via pytest-testmon, else -n auto (both
# optional). Safety gate; on by default.
PRE_PUSH_TESTS=on

# Diff-scoped CI gates (scripts/ci_scoped_gates.sh, pre-push hook): on | off. Runs heavy
# checks only when changed paths warrant them. Ships as a scaffold (one illustrative UI
# gate); opt-in. Off by default.
CI_SCOPED_GATES=off

# Review-staleness recheck (.claude/hooks/recheck-on-push.sh, PostToolUse Bash hook):
# on | off. On a git push/commit that changes a PR head SHA, flips the `ai-code-review`
# commit status to pending so a stale review can't slip past merge. Inert without an
# open PR / gh / GITHUB_OWNER+REPO (pairs with the AI review gate, DT-10). On by default.
REVIEW_RECHECK=on

# Autonomous in-session AI review gate (.claude/skills/develop/references/claude-review-gate.md):
# on | off. When on, /develop Phase 5/6 + /sprint merge dispatch a fresh-context reviewer
# (one tier above the author; opus on a security surface), fail-closed, ≤3 incremental
# cycles, then set the ai-code-review SHA status. Safety property; on by default. The
# reviewer/audit run in-session (no external bot); the GitHub status set is fail-soft.
AI_REVIEW_GATE=on

# Merge method for `gh pr merge` (the AI review gate + /sprint merge): merge | squash | rebase.
# Default `merge` preserves the template's existing behavior. Use `squash`/`rebase` for
# linear history (requires the matching branch-protection setting).
MERGE_METHOD=merge

# Sprint merge supervisor (scripts/sprint_merge_supervisor.py): on | off. A state machine
# for every non-CLEAN mergeStateStatus (BEHIND→rebase+force-push, BLOCKED→diagnose,
# DIRTY/unknown→escalate), with a per-PR attempt budget. Safe + valuable without the
# resident watch loop; on by default. Needs gh + branch protection to do anything.
SPRINT_MERGE_SUPERVISOR=on

# Resident sprint watch loop (scripts/sprint_watch.py): on | off. Fires a fresh-context
# reviewer the moment each agent opens its PR (vs waiting for the whole wave), chains fix
# cycles, queues for merge. Opt-in (a long-running loop); off by default.
SPRINT_WATCH=off
SPRINT_WATCH_POLL=60

# Non-blocking human-review handoff (.claude/skills/handoff-review/SKILL.md): on | off.
# After a wave merges, emits ONE human-only GitHub issue (label handoff:human-review,
# excluded from /sprint) showcasing each feature for review. Needs GITHUB_OWNER/REPO.
# Off by default. HANDOFF_RENDER_CMD (optional) renders the app's primary artifact for
# the showcase; when empty, the showcase links each feature's PR diff + Rail evidence.
HANDOFF_REVIEW=off
HANDOFF_RENDER_CMD=

# Council review (scripts/council-review.sh + .claude/hooks/council-on-doc-write.sh): on | off.
# When on, writing a plan (docs/plans/*-design.md), an EVR (*_evr.md), or a milestone
# summary/report (*_summary.md / *_report.md) auto-convenes a document-review council:
# codex + antigravity members (doc-review roles) synthesized by a Claude chair through the
# Architectural Methodologist persona. Engine = the vendored hex/claude-council clone
# (.dev-context/vendor/claude-council). Fully fail-soft and non-blocking — a missing
# member is skipped, the Write is never blocked. Cost policy (Sonnet chair; Opus needs
# --allow-opus) lives in council-review.sh. Both members keyless CLI subscription auth —
# needs codex + agy (antigravity-cli) on PATH; no API keys.
# Feeds .dev-context/kpis/council.csv. Off by default.
COUNCIL_REVIEW=off

# Council auto-draft of blocker fixes (scripts/council-review.sh): on | off. When on, after
# the review the wrapper drafts the chair's BLOCKER recommendations (only — never nice-to-haves
# or acceptance criteria) as unified diffs on COPIES of the target files, appended to the report.
# It NEVER applies or commits — a human reviews and applies (human stays in the loop). Sonnet
# drafter; Opus gated. Recorded in the council.csv `autofix` column. Off by default.
COUNCIL_AUTOFIX=off
