# Auto-draft PRD configuration (scripts/prd_draft.py).
#
# Read by /sprint plan when a ticket's PRD is missing required sections. If enabled,
# fills them via a generator->reviewer provider chain instead of hard-stopping.
# Failures are surfaced as Blocked/Skipped, NEVER a hard-stop.
#
# SHIPPED DISABLED so a fresh copy never calls external APIs unprompted. Set
# enabled: true (and wire providers in prd_draft.py::make_call_provider) to use it.
enabled: false

# pair   — generator drafts, reviewer refines; roles swap on generator failure.
# single — walk `providers` left-to-right, first success wins.
mode: pair

# Generator (first) then reviewer (second). Generic names — map each to a backend
# in scripts/prd_draft.py::make_call_provider.
pair_order:
  - codex
  - gemini

# Fills a missing pair role, or the last-resort single-call when the pair fails.
fallback_provider: claude

# mode: single only — providers walked in order.
providers:
  - codex
  - gemini
  - claude

timeout_seconds_generator: 60
timeout_seconds_reviewer: 60
