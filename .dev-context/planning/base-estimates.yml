# Cold-start estimation seed for the closed learning loop.
#
# /prd stamps every minted ticket with `estimate_minutes` + `recommended_model`
# derived from this table. /debrief then learns `kpis/calibration.json` (a
# per-type/effort minutes factor) and `kpis/model-policy.json` (routing) from
# real outcomes; those OVERRIDE this seed once enough samples accrue. On a
# brand-new project with zero history, only this file is consulted.

# Model tier ladder, cheapest -> most capable. Routing never drops BELOW the
# effort floor; it only up-tiers when the learned policy shows a type is
# underpowered. This encodes "the most economical model that still delivers".
model_tiers: [haiku, sonnet, opus]

# Minimum model per effort bucket (the "good enough, most economic" floor).
effort_floor:
  S: haiku
  M: sonnet
  L: opus
# Floor used when a ticket carries no effort:* label.
default_floor: sonnet

# Base wall-clock minutes per ticket type (pre-calibration).
base_minutes:
  tweak: 20
  fix: 45
  feature: 120
  refactor: 60
  docs: 15
  chore: 20
  spike: 90
  default: 60

# Optional per-type model preference (still clamped UP to the effort floor).
type_model:
  docs: haiku
  chore: haiku
  tweak: haiku
  default: sonnet
# External-executor rung (optional): set a type (or a learned model-policy entry) to
# `external:<name>` to route that ticket class to a configured non-Claude executor
# instead of a tier model. `external:*` is OFF the haiku/sonnet/opus ladder (NOT
# floor-clamped) — it is a provider choice, not a tier. The orchestrator (/sprint
# Phase D) dispatches `external:*` to the command in project.conf
# (EXTERNAL_EXECUTOR_<NAME>); with no such config it falls back to a normal Task agent.
# Example:  type_model: { spike: external:codex }

# Sanity clamp on produced estimates (minutes).
clamp_minutes: [5, 480]
